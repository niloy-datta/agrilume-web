name: Validate AgriLume web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Static export
        run: npm run build
      - name: Verify exported routes and game assets
        run: |
          test -f out/index.html
          test -f out/agrilume-farming-game.html
          test -f out/mediapipe/hands/hands.js
          test -f out/api/farming-game/catalog.json
          test "$(ls out/data/power/*.json | wc -l)" -eq 64 || { echo "::error::Expected 64 NASA POWER district files"; exit 1; }
          test "$(ls out/data/projections/*.json | wc -l)" -eq 64 || { echo "::error::Expected 64 projection packs"; exit 1; }
          for route in time-travel nasa-data bangladesh-agriculture recycling; do
            if [ ! -f "out/${route}.html" ] && [ ! -f "out/${route}/index.html" ]; then
              echo "::error::Missing static route: ${route}"
              exit 1
            fi
          done
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile viewport)
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
